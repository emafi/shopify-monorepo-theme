name: Deploy Multi-Store Themes
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # --- SYNC PHASE: Pull from Deploy branches to Main ---
      
      - name: Sync Haircare Data from Shopify
        run: |
          # Fetch the latest state of the deploy branch
          git fetch origin deploy-haircare
          
          # Create temporary directories
          mkdir -p temp_haircare_sync
          
          # Extract templates and settings from the deploy branch (which is flat)
          # We use || true to prevent the action from failing if files don't exist yet
          git show origin/deploy-haircare:templates > temp_haircare_templates.tar 2>/dev/null || true
          
          # More reliable method: checkout files to a temp location
          git checkout origin/deploy-haircare -- templates/ config/settings_data.json || echo "Specific files not found in deploy-haircare"
          
          # Copy these files into the dist folder (overwriting)
          mkdir -p dist/rica-haircare/templates
          mkdir -p dist/rica-haircare/config
          cp -rf templates/. dist/rica-haircare/templates/ || echo "No templates to copy"
          cp -f config/settings_data.json dist/rica-haircare/config/settings_data.json || echo "No settings to copy"
          
          # Clean up root from the checkout
          rm -rf templates/ config/settings_data.json

      - name: Sync Wax Data from Shopify
        run: |
          git fetch origin deploy-wax
          git checkout origin/deploy-wax -- templates/ config/settings_data.json || echo "Specific files not found in deploy-wax"
          
          mkdir -p dist/rica-wax/templates
          mkdir -p dist/rica-wax/config
          cp -rf templates/. dist/rica-wax/templates/ || echo "No templates to copy"
          cp -f config/settings_data.json dist/rica-wax/config/settings_data.json || echo "No settings to copy"
          
          rm -rf templates/ config/settings_data.json

      # --- COMMIT UPDATES TO MAIN ---
      - name: Commit sync changes
        run: |
          git add dist/
          git commit -m "chore: sync themes data from deploy branches [skip ci]" || echo "No changes to commit"
          git push origin main

      # --- DEPLOY PHASE: Re-deploy everything to Shopify branches ---
      
      - name: Deploy Rica Haircare
        run: |
          # We use subtree split on the freshly updated dist folder
          git subtree split --prefix dist/rica-haircare -b temp-haircare
          git push -f origin temp-haircare:deploy-haircare
          git branch -D temp-haircare

      - name: Deploy Rica Wax
        run: |
          git subtree split --prefix dist/rica-wax -b temp-wax
          git push -f origin temp-wax:deploy-wax
          git branch -D temp-wax