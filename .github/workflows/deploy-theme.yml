name: Deploy Multi-Store Themes
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # --- SYNC & PREPARE: Rica Haircare ---
      - name: Sync Haircare Content
        run: |
          # 1. Get templates and settings from the deploy branch (Shopify changes)
          mkdir -p temp_haircare
          git archive origin/deploy-haircare templates config/settings_data.json | tar -x -C temp_haircare || echo "No remote files found"

          # 2. Update the dist folder with these files
          mkdir -p dist/rica-haircare/templates
          mkdir -p dist/rica-haircare/config
          cp -rf temp_haircare/templates/. dist/rica-haircare/templates/ || echo "No templates to copy"
          cp -f temp_haircare/config/settings_data.json dist/rica-haircare/config/settings_data.json || echo "No settings to copy"

          # 3. CRITICAL: If you modified files in the ROOT of main, 
          # you might want to sync them INTO the dist folder here if they are shared.
          # Example: cp -rf sections/. dist/rica-haircare/sections/ (if applicable)

          rm -rf temp_haircare

      # --- SYNC & PREPARE: Rica Wax ---
      - name: Sync Wax Content
        run: |
          mkdir -p temp_wax
          git archive origin/deploy-wax templates config/settings_data.json | tar -x -C temp_wax || echo "No remote files found"

          mkdir -p dist/rica-wax/templates
          mkdir -p dist/rica-wax/config
          cp -rf temp_wax/templates/. dist/rica-wax/templates/ || echo "No templates to copy"
          cp -f temp_wax/config/settings_data.json dist/rica-wax/config/settings_data.json || echo "No settings to copy"

          rm -rf temp_wax

      # --- COMMIT AND REFRESH MAIN ---
      - name: Commit and Push to Main
        run: |
          git add dist/
          # This captures both the Shopify changes and your local changes to dist
          git commit -m "chore: sync theme distributions [skip ci]" || echo "No changes to commit"
          git push origin main

      # --- DEPLOYMENT PHASE ---
      - name: Deploy Rica Haircare
        run: |
          # The subtree split will now include EVERYTHING currently in dist/rica-haircare
          git subtree split --prefix dist/rica-haircare -b temp-haircare
          git push -f origin temp-haircare:deploy-haircare
          git branch -D temp-haircare

      - name: Deploy Rica Wax
        run: |
          git subtree split --prefix dist/rica-wax -b temp-wax
          git push -f origin temp-wax:deploy-wax
          git branch -D temp-wax