name: Deploy Multi-Store Themes
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # --- SYNC STEP: Rica Haircare ---
      - name: Sync Haircare from deploy-haircare branch
        run: |
          mkdir -p temp_sync_haircare
          # Extract root folders from deploy branch into temp folder
          git archive origin/deploy-haircare templates config/settings_data.json | tar -x -C temp_sync_haircare || echo "Remote files not found"
          
          # Clean and replace the local dist folder
          rm -rf dist/rica-haircare/templates
          mkdir -p dist/rica-haircare/templates
          mkdir -p dist/rica-haircare/config
          
          cp -rf temp_sync_haircare/templates/. dist/rica-haircare/templates/
          cp -f temp_sync_haircare/config/settings_data.json dist/rica-haircare/config/settings_data.json
          rm -rf temp_sync_haircare

      # --- SYNC STEP: Rica Wax ---
      - name: Sync Wax from deploy-wax branch
        run: |
          mkdir -p temp_sync_wax
          git archive origin/deploy-wax templates config/settings_data.json | tar -x -C temp_sync_wax || echo "Remote files not found"
          
          rm -rf dist/rica-wax/templates
          mkdir -p dist/rica-wax/templates
          mkdir -p dist/rica-wax/config
          
          cp -rf temp_sync_wax/templates/. dist/rica-wax/templates/
          cp -f temp_sync_wax/config/settings_data.json dist/rica-wax/config/settings_data.json
          rm -rf temp_sync_wax

      # --- COMMIT UPDATES BACK TO MAIN ---
      # This ensures your 'main' branch in GitHub reflects the changes from Shopify
      - name: Commit changes to main
        run: |
          git add dist/
          git commit -m "chore: sync theme templates from deploy branches [skip ci]" || echo "No changes to sync"
          git push origin main

      # --- DEPLOYMENT PHASE ---
      # We re-run subtree split to ensure the deploy branches are perfectly aligned
      - name: Deploy Rica Haircare
        run: |
          git subtree split --prefix dist/rica-haircare -b temp-haircare
          git push -f origin temp-haircare:deploy-haircare
          git branch -D temp-haircare

      - name: Deploy Rica Wax
        run: |
          git subtree split --prefix dist/rica-wax -b temp-wax
          git push -f origin temp-wax:deploy-wax
          git branch -D temp-wax