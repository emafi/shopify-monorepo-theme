name: Deploy Multi-Store Themes
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # --- STEP 1: LOCAL SYNC (From Root Theme to Dist folders) ---
      # This ensures your local edits in theme/* are reflected in both dist folders
      - name: Sync Local Theme changes to Dist
        run: |
          # List of folders to sync from theme/ to each dist store
          STORES=("dist/rica-haircare" "dist/rica-wax")
          FOLDERS=("assets" "layout" "locales" "sections" "snippets")
          
          for STORE in "${STORES[@]}"; do
            # Sync folders
            for FOLDER in "${FOLDERS[@]}"; do
              if [ -d "theme/$FOLDER" ]; then
                mkdir -p "$STORE/$FOLDER"
                cp -rf theme/$FOLDER/. "$STORE/$FOLDER/"
              fi
            done
            # Sync specific settings_schema.json
            if [ -f "theme/config/settings_schema.json" ]; then
              mkdir -p "$STORE/config"
              cp -f theme/config/settings_schema.json "$STORE/config/settings_schema.json"
            fi
          done

      # --- STEP 2: REMOTE SYNC (Pull Templates/Settings from Shopify branches) ---
      - name: Sync Shopify Data (Templates and Settings)
        run: |
          # Sync for Haircare
          git fetch origin deploy-haircare || echo "Branch deploy-haircare not found"
          git checkout origin/deploy-haircare -- templates/ config/settings_data.json 2>/dev/null || echo "Files not found in deploy-haircare"
          mkdir -p dist/rica-haircare/templates dist/rica-haircare/config
          [ -d "templates" ] && cp -rf templates/. dist/rica-haircare/templates/ && rm -rf templates
          [ -f "config/settings_data.json" ] && cp -f config/settings_data.json dist/rica-haircare/config/settings_data.json && rm -rf config

          # Sync for Wax
          git fetch origin deploy-wax || echo "Branch deploy-wax not found"
          git checkout origin/deploy-wax -- templates/ config/settings_data.json 2>/dev/null || echo "Files not found in deploy-wax"
          mkdir -p dist/rica-wax/templates dist/rica-wax/config
          [ -d "templates" ] && cp -rf templates/. dist/rica-wax/templates/ && rm -rf templates
          [ -f "config/settings_data.json" ] && cp -f config/settings_data.json dist/rica-wax/config/settings_data.json && rm -rf config

      # --- STEP 3: COMMIT ALL CHANGES TO MAIN ---
      - name: Commit and Push to Main
        run: |
          git add dist/
          git commit -m "chore: sync theme assets from root and shopify data [skip ci]" || echo "No changes to commit"
          git push origin main

      # --- STEP 4: DEPLOYMENT (Subtree Split) ---
      - name: Deploy Rica Haircare
        run: |
          git subtree split --prefix dist/rica-haircare -b temp-haircare
          git push -f origin temp-haircare:deploy-haircare
          git branch -D temp-haircare

      - name: Deploy Rica Wax
        run: |
          git subtree split --prefix dist/rica-wax -b temp-wax
          git push -f origin temp-wax:deploy-wax
          git branch -D temp-wax