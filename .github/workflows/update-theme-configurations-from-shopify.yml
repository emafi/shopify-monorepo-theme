name: Sync Templates Back to Main
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 
  push:
    branches:
      - deploy-haircare
      - deploy-wax

jobs:
  back-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for subtree operations

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync All Stores
        run: |
          # 1. Fetch latest from all deploy branches
          git fetch origin deploy-haircare deploy-wax

          # 2. Sync Haircare
          echo "Syncing Haircare..."
          git subtree pull --prefix dist/rica-haircare origin deploy-haircare --squash -m "chore: sync live settings [haircare]" || echo "No changes for haircare"

          # 3. Sync Wax
          echo "Syncing Wax..."
          git subtree pull --prefix dist/rica-wax origin deploy-wax --squash -m "chore: sync live settings [wax]" || echo "No changes for wax"

          # 4. Push combined changes back to main
          git push origin main